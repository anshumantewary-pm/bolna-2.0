[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolna-voice-agent"
version = "0.1.0"
description = "Real-time voice AI agent: streaming STT -> Claude agent loop with tools -> streaming TTS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.10", "httpx>=0.28", "websockets>=15"]

[project.optional-dependencies]
# Local microphone/speaker for `voice-agent --voice` (needs PortAudio; bundled on Windows/macOS).
mic = ["sounddevice>=0.5"]
dev = ["pytest>=8"]
# Real-browser end-to-end tests (then: playwright install chromium).
e2e = ["playwright>=1.48"]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: drives the real call page in headless Chromium (needs the e2e extra)"]
